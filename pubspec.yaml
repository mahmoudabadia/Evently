name: evently_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  flutter_localizations:
    sdk: flutter
  intl: any
  easy_localization: ^3.0.8
  provider: ^6.1.5+1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.8.0
  fluttertoast: ^10.0.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/img1.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/x1/
    - assets/images/x2/
    - assets/images/x3/
    - assets/language/x1/
    - assets/language/x2/
    - assets/language/x3/
    - assets/translations/